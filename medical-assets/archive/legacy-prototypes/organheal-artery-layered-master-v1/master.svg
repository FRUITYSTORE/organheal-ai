  <metadata>ORGANHEAL_RECONSTRUCTION_FROM_PUBLIC_DOMAIN_REFERENCE; NHLBI Atherosclerosis diagram.png; sourceSHA256=9a9865390c625960d6bfcee88baecddb18bd74a21c611e9de2659f6f32203e48; MEDICAL_REVIEW_PENDING; educational nonliteral scale. No histology, thrombus, early lesion or clinical percentage.</metadata>
  <defs>
