    <linearGradient id="wall-tissue" x1="0" y1="0" x2="0.6" y2="1" data-family="PRESENTATION"><stop offset="0" stop-color="#be8578"/><stop offset="0.22" stop-color="#9e6257"/><stop offset="0.58" stop-color="#80483f"/><stop offset="1" stop-color="#ba8170"/></linearGradient>
    <linearGradient id="blood-depth" x1="0" y1="0" x2="0.2" y2="1" data-family="PRESENTATION"><stop offset="0" stop-color="#3e141b"/><stop offset="0.33" stop-color="#79242b"/><stop offset="0.68" stop-color="#8d3233"/><stop offset="1" stop-color="#48151f"/></linearGradient>
    <linearGradient id="plaque-tissue" x1="0" y1="0" x2="0.2" y2="1" data-family="PRESENTATION"><stop offset="0" stop-color="#a48a5f"/><stop offset="0.45" stop-color="#c0a877"/><stop offset="0.72" stop-color="#af8e59"/><stop offset="1" stop-color="#7c5a3f"/></linearGradient>
    <radialGradient id="environment" cx="0.5" cy="0.48" r="0.7" data-family="PRESENTATION"><stop offset="0" stop-color="#29343e"/><stop offset="0.5" stop-color="#18232e"/><stop offset="1" stop-color="#090f18"/></radialGradient>
