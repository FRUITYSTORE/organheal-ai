<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-master="ORGANHEAL_ARTERY_LAYERED_MASTER_V1" data-state="HEALTHY" data-mode="MEDICAL_BASE_MODE" data-patient-facing="false">
