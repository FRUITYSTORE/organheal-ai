    <clipPath id="plaque-clip" data-family="PATHOLOGY"><use id="plaque-clip-reference" href="#plaque"/></clipPath>
    <mask id="residual-lumen-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920" data-family="PATHOLOGY"><use id="residual-healthy-region" href="#lumen" fill="white" stroke="none"/><use id="residual-plaque-subtraction" href="#plaque" fill="black" stroke="none"/></mask>
  </defs>
  <style>
    .presentation { display:none; }
    .pathology { display:none; }
    #ARTERY_OUTER {fill:#a96b63;} #ARTERY_WALL {fill:#bd8275;fill-rule:evenodd;}
    #LUMEN {fill:#651f28;} #BLOOD_REGION {fill:#8c3439;}
    #PLAQUE {fill:#baa06a;stroke:#947349;stroke-width:2;stroke-linejoin:round;}
    #NARROWED_LUMEN_STATE {fill:none;stroke:#debbb0;stroke-width:2;opacity:0.65;}
    svg[data-state="PLAQUE"] .pathology,svg[data-state="NARROWED"] .pathology {display:inline;}
    svg[data-state="NARROWED"] #NARROWED_LUMEN_STATE {stroke-width:3;opacity:0.85;}
    svg[data-mode="ORGANHEAL_PRESENTATION_MODE"] .presentation {display:inline;}
    svg[data-mode="ORGANHEAL_PRESENTATION_MODE"] #ARTERY_OUTER {fill:url(#tissue);}
    svg[data-mode="ORGANHEAL_PRESENTATION_MODE"] #ARTERY_WALL {fill:url(#wall-tissue);}
    svg[data-mode="ORGANHEAL_PRESENTATION_MODE"] #LUMEN {fill:#46151e;}
    svg[data-mode="ORGANHEAL_PRESENTATION_MODE"] #BLOOD_REGION {fill:url(#blood-depth);}
    svg[data-mode="ORGANHEAL_PRESENTATION_MODE"] #PLAQUE {fill:url(#plaque-tissue);stroke:#896b4b;}
  </style>
