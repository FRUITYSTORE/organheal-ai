    <filter id="tissue-presentation" x="0" y="0" width="100%" height="100%" data-family="PRESENTATION"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="17" result="grain"/><feColorMatrix in="grain" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <clipPath id="outer-clip" data-family="ANATOMY"><use id="outer-clip-reference" href="#artery-outer"/></clipPath>
